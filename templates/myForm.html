<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <script>
        function validateForm() {
            const username = document.forms["f1"]["username"].value.trim();
            const password = document.forms["f1"]["pwd"].value;

            if (username === "") {
                alert("Username cannot be empty.");
                return false;
            }
            if (password === "") {
                alert("Password cannot be empty.");
                return false;
            }
            if (password.length < 6) {
                alert("Password must be at least 6 characters long.");
                return false;
            }
            return true;
        }
    </script>
</head>
<body>
    <center>
        <h2>Application Form</h2>
        <form name="f1" action="/submit" method="POST"
              onsubmit="return validateForm()">
            Enter Your Name:
            <input type="text" name="username" id="username">
            <br><br>
            Enter Your Password:
            <input type="password" name="pwd" id="pwd">
            <br><br>
            <input type="submit" name="sb" id="submit" value="Submit">
        </form>
    </center>
</body>
</html>
