apiVersion: apps/v1
kind: Deployment
metadata:
  name: seleniumtestdemoapp-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seleniumtestdemoapp
  template:
    metadata:
      labels:
        app: seleniumtestdemoapp
    spec:
      containers:
        - name: seleniumtestdemoapp
          image: tsamhitha26/seleniumtestdemoapp:v1
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: seleniumtestdemoapp-service
spec:
  type: NodePort
  selector:
    app: seleniumtestdemoapp
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30188
